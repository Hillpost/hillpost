name: CLI release

on:
  push:
    tags:
      - 'cli/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      # GoReleaser only understands semver tags, so give it a local vX.Y.Z tag
      # for the same commit. It is never pushed; the release stays on cli/vX.Y.Z.
      - name: Name the version
        run: |
          version=${GITHUB_REF_NAME#cli/}
          git tag -f "$version" "$GITHUB_REF_NAME"
          echo "GORELEASER_CURRENT_TAG=$version" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
          workdir: cli

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt --title "hillpost ${GITHUB_REF_NAME#cli/}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
